# ============================================================================
# hpulogc 配置文件完整字段清单（examples/conf_eg.ini）
# ============================================================================
# 本文件是 docs/rd_v0.6.md §10.3 配置模板的可运行副本：覆盖全部 9 个节、
# 全部配置键，默认值可直接运行（相对路径 logs/ 会在运行目录下生成）。
# 唯一规范源是 rd_v0.6.md §10.3；本副本随其同步更新。
#
# 语法要点（§10.1，词法与 zlog conf 一致）：
#   - 仅 # 为注释字符：# 起始的行为注释行；行尾 # 后为注释（双引号内除外）。
#     注意：分号 ; 不是注释符，会被并入 value。
#   - 行尾独立反斜杠 \ 为续行符。
#   - key = value；value 为 = 后整行（可含空格），可用成对双引号包裹；
#     引号内 # 、 , 、= 均不具特殊含义。
#   - 键名区分大小写（空格分词）；级别名/布尔/枚举值大小写不敏感。
#   - 尺寸后缀：1k=1000, 1kb=1024, 1m=10^6, 1mb=2^20, 1g=10^9, 1gb=2^30。
#   - 出现的节须保持相对顺序（§10.2）：[build] -> [global] -> [formats] ->
#     [outputs] -> [buffer] -> [async] -> [throttle] -> [rules] -> [advanced]。
#     所有节均可省略（省略 = 默认值）。
# ============================================================================


# ============================================================================
# [build] 构建信息（可选；只读展示）
# ============================================================================
# 值由构建期决定，写在此处的值会被忽略：与实际构建不一致时输出警告。
# 通常无需书写此节；如需展示构建信息，用 hpulogc_get_build_info() 读取。
# 可用键：build version（full/min/sync_thread/async_single）、
#         concurrency（spsc/mpsc/mpmc）、lockfree（true/false）、
#         has async / has color / has rotate / has hot reload /
#         has category / has throttle / has ini（true/false）
# ============================================================================
#[build]
#
#build version = full
#concurrency = mpsc
#lockfree = false
#has async = true
#has color = true
#has rotate = true
#has hot reload = true
#has category = true
#has throttle = false
#has ini = true


# ============================================================================
# [global] 全局运行时配置
# ============================================================================
[global]

# 语法严格性：true 时未知键启动失败；false 时未知键降级为 stderr 警告并忽略
# （其余错误——语法错误、缺值、重复定义、引用未定义名称——无论取值均启动失败）
# 仅在 init 时生效；热加载解析时未知键按当前生效值处理（§10.5）
strict init = true

# 过滤级别，低于此级别的日志被丢弃：TRACE / DEBUG / INFO / WARN / ERROR / FATAL
level = INFO

# 未命中任何规则时的兜底 format 名（引用 [formats] 中已定义的名称）
default format = standard

# 未命中任何规则时的兜底 outputs（逗号分隔，引用 [outputs] 中已定义的名称）
# 未命中规则且该值为空时，该条日志被丢弃
default outputs = console_out

# 时区：local（本地时区）或 utc
timezone = local

# 时间戳源：
#   realtime  - 真实时间，受 time format 控制显示格式
#   monotonic - 单调时钟，%time 固定输出相对 init 的 "秒.微秒"，time format 忽略
timestamp source = realtime

# 时间格式（strftime 风格，扩展占位符：%f 微秒、%F3 毫秒）
time format = %Y-%m-%d %H:%M:%S.%f

# 字符编码（当前仅支持 utf-8）
encoding = utf-8

# 运行时是否捕获源码位置（编译期 HPULOGC_ENABLE_SOURCE_LOC=OFF 时此键忽略）
capture source loc = true

# 换行符：auto（跟随平台，Unix=\n / Windows=\r\n）、lf（统一 \n）、crlf（统一 \r\n）
newline = auto

# 进程/线程 ID 显示格式：decimal（十进制）、hex（十六进制）、none（不显示）
pid format = decimal
tid format = decimal

# 配置文件变更检查间隔（秒），0 表示禁用热加载轮询
# Linux 优先 inotify、macOS 优先 kqueue，此值为原生通知不可用时的回退轮询间隔
hot reload interval = 5

# 是否由库注册 SIGHUP 处理器触发配置热加载检查（默认关闭，避免与宿主应用
# 信号处理冲突）；仅 HPULOGC_ENABLE_HOT_RELOAD=ON 时有效；与
# hot reload interval = 0 独立（信号为显式触发，仍生效）
signal reload = false


# ============================================================================
# [formats] 日志格式模板
# ============================================================================
# 内置五个格式名已预注册（minimal / standard / categorized / detailed /
# json，模板见 §10.3），直接在 [rules] 中引用即可；在此处重定义同名格式
# 属重复定义，strict init 下启动失败。需要字段输出时自定义命名格式并
# 放置 %v 占位符（内置格式中仅 json 自动追加 fields 成员）。
#
# 可用占位符：%level %time %pid %tid %file %line %func %msg %category %n %%
#             %v（结构化字段 k=v 列表，§4.11.5）
# ============================================================================
[formats]

rendered = "%time [%level] %msg %v%n"


# ============================================================================
# [outputs] 输出目标（sink 实例）定义
# ============================================================================
# 行内参数为逗号分隔的 key=value，值可用双引号包裹（含空格、逗号、等号的值）。
#
# 通用键（所有类型，由核心消费）：
#   enabled     = true|false   false 的实例不参与路由（实例资源仍建立，
#                              热重载翻转即时生效、无需重开资源；§4.7.3）
#   async       = on|off       启用 per-sink 异步投递（专属队列 + worker，§4.10.6）
#   queue size  = <size>       异步队列字节容量，64KB~16MB（越界钳制并告警）
#
# 内置类型（未注册的类型一律启动失败，§10.4）：
#   console     stream=stdout|stderr, color=true|false
#   rollingfile path, rotate=none|size|time|both, max size, time unit=hour|day|week|month,
#               max files, fsync, symlink latest, rotate naming, file perms, dir perms
#   file        rollingfile 的配置别名（rotate 默认 none），其余键完全一致
#   syslog      facility=user|daemon|local0..local7（POSIX 专属，进程内单实例；
#               Windows 构建无法注册，使用本文件时需删除该实例行）
#   null        无私有键（丢弃一切；审计/指标下线的路由落点）
#   <自定义类型> hpulogc_sink_register() 注册的类型（§4.10.5，init 前注册）
# ============================================================================
[outputs]

# 同步控制台：级别着色仅在终端生效（重定向后自动纯文本）
console_out = console, stream=stdout, color=true
console_err = console, stream=stderr, color=true

# 按大小轮转；文件/目录权限为 POSIX 八进制（Windows 上忽略并输出一次性告警）
main_log = file, path=logs/app.log, rotate=size, max size=100mb, max files=10, file perms=0644, dir perms=0755

# 按时间轮转（time unit=hour|day|week|month；both = 大小 + 时间）
error_log = file, path=logs/error.log, rotate=time, time unit=day, max files=30

# 逐条 fsync（与 [advanced] crash safety 组合，§9）
audit_log = file, path=logs/audit.log, rotate=none, fsync=true, file perms=0600

# 归档命名模板：{base}/{timestamp}/{index}（默认 "{base}.{timestamp}.{index}.log"）
trace_log = file, path=logs/trace.log, rotate=none, rotate naming={base}.{timestamp}.{index}.log

# 已下线但保留路由占位的实例：enabled=false 不参与路由（翻转即时生效）
legacy_log = file, path=logs/legacy.log, enabled=false

# per-sink 异步投递：慢 sink 隔离；队列满丢弃该实例的事件并计入其
# dropped 统计，不阻塞其他 sink（§4.10.6）
net_log = rollingfile, path=logs/net.log, async=on, queue size=1mb

# 生产环境建议使用绝对路径（Linux/macOS）：
# main_log = file, path=/var/log/myapp/app.log, rotate=size, max size=100mb, max files=10
# Windows 路径（含空格或反斜杠时用双引号包裹）：
# main_log_win = file, path="C:\Logs\MyApp\app.log", rotate=size, max size=100mb, max files=10

# syslog（POSIX 专属，进程内单实例；Windows 构建需删除此行）
syslog_out = syslog, facility=user

# null：丢弃一切但计入 written（审计/指标下线的路由落点）
drop_here = null


# ============================================================================
# [buffer] 环形缓冲区运行时参数（仅 init 时生效，热加载忽略变更）
# ============================================================================
# 注意：并发模式与是否无锁由编译期构建决定（HPULOGC_CONCURRENCY /
# HPULOGC_LOCKFREE），不可在此设置
# ============================================================================
[buffer]

# 共享环形缓冲容量（字节，支持尺寸后缀）
buffer size = 1mb

# 溢出策略：discard（丢弃新事件）/ overwrite（复用最旧槽位，仅 SPSC 无锁）/ wait
overflow policy = discard


# ============================================================================
# [async] 异步写入参数（HPULOGC_ENABLE_ASYNC=OFF 时此节被跳过）
# ============================================================================
[async]

# 批量提交条数（1~65535）
batch size = 64

# 未攒满 batch 时的强制提交间隔（毫秒，1~60000）
flush interval = 100

# shutdown 等待异步写入完成的超时（毫秒，0 = 无限等待）
shutdown timeout = 5000

# 消费者线程数（1~16，默认 1；>1 需 MPMC 构建，§4.2；仅 init 生效）
consumer threads = 1


# ============================================================================
# [throttle] 限流与采样（HPULOGC_ENABLE_THROTTLE=OFF 时此节被跳过）
# ============================================================================
# 执行顺序：先限流，后采样（§4.9③）
# ============================================================================
[throttle]

# 全局令牌桶速率（条/秒），0 表示不限流；桶容量 = burst size
global rate limit = 0

# 每个 category 独立令牌桶速率（条/秒），0 表示不限流；
# 与全局限流独立检查，任一超限即丢弃
per category rate limit = 0

# 采样率（0.0 ~ 1.0）：确定性 1/N 采样，N = round(1/采样率)，
# 全局共享原子计数器，每 N 条放行 1 条；0.0 = 全部丢弃，1.0 = 全部放行
sampling rate = 1.0

# 令牌桶容量（条），全局桶与分类桶共用
burst size = 100


# ============================================================================
# [rules] 日志路由规则
# ============================================================================
# 语法：category.level = format_name, output_name1, output_name2, ...
# format/output 仅允许引用 [formats]/[outputs] 中已定义的名称，不支持内联定义
#
# selector 以最后一个 '.' 分割为 category 与 level；level 部分不得包含 '.'。
#
# category 匹配：
#   *          匹配所有分类
#   name       精确匹配分类名
#   name.*     匹配 name 及其子分类（以 '.' 分隔的层级前缀，含 name 自身）
#
# level 匹配：
#   *          所有级别
#   LEVEL      精确匹配（如 TRACE）
#   A~B        范围匹配，含端点（如 ERROR~FATAL 表示 ERROR 及以上）；
#              min > max 为配置错误（§10.4）
#
# 匹配语义（规范性，zlog 风格，纯顺序）：
#   - 从上到下扫描，第一条 category 匹配且 level 落在范围内的规则生效
#   - 仅生效一条规则；该条日志按此规则的 outputs 各输出一份
#   - 兜底规则（category 为 *）必须放在具体规则之后
#   - 无任何命中规则时，按 [global] 的 default format + default outputs 兜底
# ============================================================================
[rules]

app.debug.* = detailed, error_log
security.* = json, audit_log
db.WARN~FATAL = standard, main_log
net.ERROR~FATAL = rendered, main_log, console_err
app.* = categorized, main_log
worker.* = rendered, net_log
*.* = standard, console_out


# ============================================================================
# [advanced] 高级选项
# ============================================================================
[advanced]

# 日志注入防护：转义用户消息中的换行符和 ANSI 序列（不影响库自身的颜色序列；
# json 格式下不生效，见 §12）
escape injection = true

# 单条日志最大长度（字节，256~65536），超出后按 truncation marker 截断
# （同时约束生产者线程的消息体渲染上限，§9）
max log length = 4096

# 截断标记（追加在被截断的行尾）
truncation marker = ...[TRUNCATED]

# fork() 后子进程行为：reinit（重建运行时）/ disable（子进程丢弃日志）/
# inherit（子进程继续使用，仅同步构建安全）；配置文件专属键（§9）
fork behavior = reinit

# 是否允许 hpulogc_log_signal_safe() 实际输出（见 §7.3/§9）
signal safe = false

# fsync 策略：none / periodic / entry / shutdown（含义见 §9）
crash safety = shutdown

# 统计信息输出间隔（秒），0 表示禁用（min 构建下忽略）
stats interval = 0

# 统计输出目标：stderr 或 file（使用 stats file 路径）
stats output = stderr
# stats file = logs/stats.log
